name: Browser validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    name: WebKit matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      # apt installs Selenium for the system interpreter, not a hosted toolcache Python.
      BROWSER_PYTHON: /usr/bin/python3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise evidence
        shell: bash
        run: |
          mkdir -p browser-results
          printf 'commit=%s\nrun_id=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > browser-results/ci-context.txt

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Install WebKit and Python browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb xauth python3-selenium
          /usr/bin/python3 -c "import selenium; print(selenium.__version__)"
          test -x /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/MiniBrowser

      - name: Check types, lint and all guards
        shell: bash
        run: |
          set -o pipefail
          mkdir -p browser-results
          pnpm typecheck 2>&1 | tee browser-results/typecheck.log
          pnpm lint 2>&1 | tee browser-results/lint.log
          pnpm guard 2>&1 | tee browser-results/guards.log

      - name: Run full WebKit matrix with a fresh build
        run: pnpm test:browser

      - name: Save browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-results/
          if-no-files-found: warn
          retention-days: 14
