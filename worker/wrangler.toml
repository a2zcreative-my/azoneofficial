name = "azoneofficial-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"

# Bind the API to the production domain. With these here, `wrangler deploy`
# attaches the routes automatically — no manual dashboard step to forget.
# Requests to azoneofficial.com/api/* hit this Worker BEFORE Cloudflare Pages,
# which is what makes /api/v1/auth/google resolve instead of 404ing against
# the static site.
routes = [
  # v1.29.2 — CEO's decision, 19-08-2026: "No more API under
  # azoneofficial.com". One domain, one API. The old domain's routes are
  # gone; `wrangler deploy` reconciles this list, so they are removed from
  # the Worker on the next deploy.
  #
  # This costs nothing TODAY because azoneofficial.com has no DNS records at
  # all — it already serves nothing. What it does cost, whenever TikTok is
  # reconnected: Partner Center still holds
  #   https://azoneofficial.com/api/v1/integrations/tiktok/callback
  #   https://azoneofficial.com/api/v1/integrations/tiktok/webhook
  # Those URLs must be changed to a2zcreative.my in Partner Center BEFORE
  # the next TikTok authorisation, or the sync will not come back.
  #
  # Restoring the old domain later is these two lines again — nothing else.
  { pattern = "a2zcreative.my/api/*", zone_name = "a2zcreative.my" },
  { pattern = "www.a2zcreative.my/api/*", zone_name = "a2zcreative.my" },
]
account_id = "39fe816a63f159da3b17cc254a89d105"

[[d1_databases]]
binding = "DB"
database_name = "azoneofficial"
database_id = "d9df2d7a-8303-4396-a4ee-a26836a4c9a8"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "azoneofficial"

[vars]
# Non-secret vars kept out of source: set them in the Cloudflare dashboard
# (Workers & Pages → your Worker → Settings → Variables) or via
# `wrangler secret put` for the sensitive ones below. Nothing here is hardcoded.
#
# Non-secret plaintext variables to set:
ALLOWED_ORIGIN     = "https://a2zcreative.my"
# v1.29.2: one domain. a2zcreative.my (and its www twin) is the only origin
# that may sign in and call the API, and every link we mint uses it.
# The legacy single-value ALLOWED_ORIGIN above is kept in step with it so an
# older Worker build can never fall back to a domain we no longer serve.
ALLOWED_ORIGINS    = "https://a2zcreative.my"
# v1.29.3 — three brands, three websites, ONE back office. The consultancy
# site (azoneofficial.com, AZ ONE OFFICIAL — a separate legal entity) may
# submit its contact form into the portal's Enquiries tab and NOTHING else:
# this list is consulted at exactly one route, POST /api/v1/enquiries, and
# its CORS preflight. It grants no session, no staff data, no other endpoint.
# ELFIA's store is a CLIENT site and is deliberately absent.
PUBLIC_FORM_ORIGINS = "https://azoneofficial.com"
# The staff EMAIL domain — deliberately NOT the website domain. Staff sign in
# as name@azoneofficial.com (Google Workspace), and this gates who may hold a
# staff/admin role. Changing it before the mailboxes move would lock every
# existing staff member out of their own role edits.
COMPANY_DOMAIN     = "azoneofficial.com"
GOOGLE_CLIENT_ID   = "357852391876-0hln8ehf5do4pb188kfh8rt486nvj4d9.apps.googleusercontent.com"
# TikTok Shop Partner Center app (service ID 7668934538403645205). The app key
# is an public identifier — it travels in query strings on every API call — so
# it lives here; the app SECRET never does.
TIKTOK_APP_KEY     = "6kraboau1veif"
#
# Secrets (set via `wrangler secret put <NAME>`, never commit):
#   SESSION_PEPPER          — random 32+ chars mixed into password hashing
#   GOOGLE_CLIENT_SECRET    — from the same Google Cloud OAuth client
#   SETUP_TOKEN             — random 32+ chars; one-time super admin bootstrap
#   TIKTOK_APP_SECRET       — from Partner Center → your app (NEVER commit)
#   TIKTOK_WEBHOOK_SECRET   — optional; only for a relay (Make/Zapier) path
#   ELFIA_BRIDGE_KEY        — shared with the ELFIA store's BRIDGE_KEY (same
#                             value both sides); unset = bridge answers 501
#   ELFIA_ORDERS_URL        — the store's orders feed, e.g.
#                             https://<store-domain>/api/v1/bridge/orders —
#                             a SECRET so the client's domain never enters a
#                             committed file; unset = 5-min poller silently off
#   VAPID_PUBLIC_KEY        — optional trio for Web Push (v1.6.0); push is
#   VAPID_PRIVATE_KEY         silently off while any of the three is unset
#   VAPID_SUBJECT           — mailto: contact for the push service
#   NOTIFY_WEBHOOK          — optional; relays every notification as JSON
# (v1.35.0: this list was missing the last five — every secret the code
#  reads is now on the record here, the one place people look.)

# Crons: TikTok auto-sync every 30 minutes (v1.4.66; harmless no-op until the
# TikTok setup completes) + nightly database backup to R2 at 03:20 MYT
# (19:20 UTC, v1.4.72 — keeps the newest 30 under backups/ in the bucket)
# + ELFIA web-orders poll every 5 minutes (v1.37.0; silent no-op until
# ELFIA_ORDERS_URL and ELFIA_BRIDGE_KEY are set — its handler RETURNS
# immediately so 5-min firings never fall into the 30-min chain).
[triggers]
crons = ["*/5 * * * *", "*/30 * * * *", "20 19 * * *", "0 1 * * *"] # 5-min ELFIA orders / 30-min TikTok sync / 03:20 MYT backup / 09:00 MYT birthday greetings
