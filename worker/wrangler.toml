name = "azoneofficial-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"
account_id = "39fe816a63f159da3b17cc254a89d105"

[[d1_databases]]
binding = "DB"
database_name = "azoneofficial"
database_id = "d9df2d7a-8303-4396-a4ee-a26836a4c9a8"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "azoneofficial"

[vars]
# Non-secret vars kept out of source: set them in the Cloudflare dashboard
# (Workers & Pages → your Worker → Settings → Variables) or via
# `wrangler secret put` for the sensitive ones below. Nothing here is hardcoded.
#
# Non-secret plaintext variables to set:
#   ALLOWED_ORIGIN     = https://azoneofficial.com
#   COMPANY_DOMAIN     = azoneofficial.com
#   GOOGLE_CLIENT_ID   = 357852391876-0hln8ehf5do4pb188kfh8rt486nvj4d9.apps.googleusercontent.com
#
# Secrets (set via `wrangler secret put <NAME>`, never commit):
#   SESSION_PEPPER          — random 32+ chars mixed into password hashing
#   GOOGLE_CLIENT_SECRET    — from the same Google Cloud OAuth client
#   SETUP_TOKEN             — random 32+ chars; one-time super admin bootstrap
